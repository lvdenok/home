<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>博客 - %VITE_SITE_NAME%</title>
    <link rel="icon" href="/images/icon/favicon.ico" />
    <link rel="stylesheet" href="https://s1.hdslb.com/bfs/static/jinkela/long/font/regular.css" />
    <style>
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'HarmonyOS Sans', '微软雅黑', Arial, sans-serif;
        color: #333;
        position: relative;
        z-index: 1;
      }
      .blog-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: -1;
        object-fit: cover;
        filter: blur(20px) brightness(0.3);
        transition: filter 0.3s, transform 0.3s;
      }
      .blog-container {
        font-size: 2rem;
        background: #fff;
        padding: 2rem 3rem;
        border-radius: 16px;
        box-shadow: 0 4px 24px rgba(0,0,0,0.08);
        z-index: 2;
      }
    </style>
  </head>
  <body>
    <img class="blog-bg" src="/images/background5.jpg" alt="背景" />
    <div class="blog-container">这里编辑</div>
  </body>
</html>
